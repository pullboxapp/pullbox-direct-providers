version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - python
    groups:
      python-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    labels:
      - dependencies
      - ci
    groups:
      actions-all:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /docker
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(docker)
    labels:
      - dependencies
      - docker
