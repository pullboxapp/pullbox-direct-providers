name: Synthetic Provider Release

on:
  push:
    tags:
      - "synthetic-v*"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pullbox-direct-provider-synthetic

concurrency:
  group: synthetic-provider-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Signed Synthetic Provider
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=synthetic-v(.*),group=1
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=Pullbox Synthetic Direct Download Provider
            org.opencontainers.image.description=Reference and conformance provider for the Pullbox direct-download protocol
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and publish AMD64 and ARM64 images
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.synthetic
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=synthetic-provider-release-v1
          cache-to: type=gha,mode=max,scope=synthetic-provider-release-v1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected synthetic provider digest: ${DIGEST}"
            exit 1
          fi

          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/synthetic-release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Save immutable release digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/synthetic-provider-release"
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/synthetic-provider-release/digest.txt"

      - name: Upload release digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-provider-release-digest
          path: ${{ runner.temp }}/synthetic-provider-release/digest.txt
          if-no-files-found: error
          retention-days: 30
