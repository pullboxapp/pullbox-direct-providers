name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install '.[dev]'
      - name: Lint and type check
        run: |
          ruff check .
          ruff format --check .
          mypy

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install '.[dev]'
      - name: Run tests and coverage gate
        run: pytest --cov --cov-report=term-missing -q

  container-conformance:
    name: Private Network Conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build and test isolated synthetic provider
        run: make docker-conformance

  required:
    name: CI Required
    if: always()
    needs:
      - quality
      - test
      - container-conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      TEST_RESULT: ${{ needs.test.result }}
      CONTAINER_RESULT: ${{ needs.container-conformance.result }}
    steps:
      - name: Verify required jobs
        run: |
          if [[ "$QUALITY_RESULT" != "success" || \
                "$TEST_RESULT" != "success" || \
                "$CONTAINER_RESULT" != "success" ]]; then
            echo "One or more required provider checks failed."
            exit 1
          fi
