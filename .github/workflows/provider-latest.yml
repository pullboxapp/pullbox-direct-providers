---
# Serializes the mutable latest tag independently from immutable provider
# releases. Duplicate pending requests are safe to replace because every run
# recomputes the highest published stable release before writing either registry.

name: Provider Latest Reconciliation

on:
  repository_dispatch:
    types: [provider-latest-reconcile]
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider latest tag to reconcile"
        required: true
        type: choice
        options:
          - getcomics
          - annas-archive
          - libgen
          - synthetic

permissions:
  contents: read

concurrency:
  group: provider-latest-${{ github.event.client_payload.provider || inputs.provider }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Provider Latest Tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Resolve trusted provider registry mapping
        id: provider
        env:
          REQUESTED_PROVIDER: ${{ github.event.client_payload.provider || inputs.provider }}
        run: |
          case "${REQUESTED_PROVIDER}" in
            getcomics|annas-archive|libgen|synthetic) ;;
            *)
              echo "::error::Unsupported provider reconciliation request: ${REQUESTED_PROVIDER}"
              exit 1
              ;;
          esac

          echo "provider=${REQUESTED_PROVIDER}" >> "${GITHUB_OUTPUT}"
          echo "ghcr-image=ghcr.io/${{ github.repository_owner }}/pullbox-provider-${REQUESTED_PROVIDER}" >> "${GITHUB_OUTPUT}"
          echo "dockerhub-image=docker.io/pullbox/pullbox-provider-${REQUESTED_PROVIDER}" >> "${GITHUB_OUTPUT}"

      - name: Select highest stable provider release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVIDER: ${{ steps.provider.outputs.provider }}
        run: |
          gh release list \
            --limit 1000 \
            --json tagName,isDraft,isPrerelease \
            > provider-releases.json
          python .github/scripts/select-latest-provider-release.py \
            --provider "${PROVIDER}" \
            --releases provider-releases.json \
            --github-output "${GITHUB_OUTPUT}"

      - name: Report no stable release
        if: steps.latest.outputs.found != 'true'
        run: |
          {
            echo "## Provider Latest Unchanged"
            echo ""
            echo "No published stable release exists for ${{ steps.provider.outputs.provider }}."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Docker Buildx
        if: steps.latest.outputs.found == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: steps.latest.outputs.found == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.latest.outputs.found == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Cosign
        if: steps.latest.outputs.found == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Promote highest stable release to latest
        if: steps.latest.outputs.found == 'true'
        env:
          GHCR_IMAGE: ${{ steps.provider.outputs.ghcr-image }}
          DOCKERHUB_IMAGE: ${{ steps.provider.outputs.dockerhub-image }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          GHCR_DIGEST=$(docker buildx imagetools inspect \
            "${GHCR_IMAGE}:${LATEST_VERSION}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          DOCKERHUB_DIGEST=$(docker buildx imagetools inspect \
            "${DOCKERHUB_IMAGE}:${LATEST_VERSION}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          if ! [[ "${GHCR_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected highest stable digest: ${GHCR_DIGEST}"
            exit 1
          fi
          if [ "${GHCR_DIGEST}" != "${DOCKERHUB_DIGEST}" ]; then
            echo "::error::Highest stable release differs between registries."
            exit 1
          fi

          certificate_identity="https://github.com/${{ github.repository }}/.github/workflows/provider-release.yml@refs/tags/${LATEST_TAG}"
          cosign verify \
            --certificate-identity "${certificate_identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${GHCR_IMAGE}@${GHCR_DIGEST}"
          cosign verify \
            --certificate-identity "${certificate_identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${DOCKERHUB_IMAGE}@${DOCKERHUB_DIGEST}"

          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:latest" \
            "${GHCR_IMAGE}@${GHCR_DIGEST}"
          docker buildx imagetools create \
            --tag "${DOCKERHUB_IMAGE}:latest" \
            "${DOCKERHUB_IMAGE}@${DOCKERHUB_DIGEST}"

          RESOLVED_GHCR=$(docker buildx imagetools inspect \
            "${GHCR_IMAGE}:latest" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          RESOLVED_DOCKERHUB=$(docker buildx imagetools inspect \
            "${DOCKERHUB_IMAGE}:latest" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [ "${RESOLVED_GHCR}" != "${GHCR_DIGEST}" ] || \
             [ "${RESOLVED_DOCKERHUB}" != "${GHCR_DIGEST}" ]; then
            echo "::error::Latest promotion did not preserve the signed digest."
            exit 1
          fi

          {
            echo "## Latest Provider Image Reconciled"
            echo ""
            echo "**Provider:** ${{ steps.provider.outputs.provider }}"
            echo "**Stable release:** ${LATEST_TAG}"
            echo "**Digest:** \`${GHCR_DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
