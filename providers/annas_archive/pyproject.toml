[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pullbox-provider-annas-archive"
version = "0.1.0.dev0"
description = "Optional Anna's Archive discovery provider for Pullbox"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "pullbox-direct-provider-contract==0.1.0.dev0",
    "uvicorn>=0.34,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pullbox_provider_annas_archive"]
