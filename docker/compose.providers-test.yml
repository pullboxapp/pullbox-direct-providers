services:
  getcomics:
    build:
      context: ..
      dockerfile: docker/Dockerfile.getcomics
      args:
        PYTHON_BASE: public.ecr.aws/docker/library/python:3.14.8-slim-trixie@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
    environment:
      PULLBOX_PROVIDER_TOKEN: ${PULLBOX_PROVIDER_TOKEN:-test-provider-token-with-sufficient-entropy}
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - provider-test

  annas-archive:
    build:
      context: ..
      dockerfile: docker/Dockerfile.annas-archive
      args:
        PYTHON_BASE: public.ecr.aws/docker/library/python:3.14.8-slim-trixie@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
    environment:
      PULLBOX_PROVIDER_TOKEN: ${PULLBOX_PROVIDER_TOKEN:-test-provider-token-with-sufficient-entropy}
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - provider-test

  libgen:
    build:
      context: ..
      dockerfile: docker/Dockerfile.libgen
      args:
        PYTHON_BASE: public.ecr.aws/docker/library/python:3.14.8-slim-trixie@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
    environment:
      PULLBOX_PROVIDER_TOKEN: ${PULLBOX_PROVIDER_TOKEN:-test-provider-token-with-sufficient-entropy}
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - provider-test

  smoke:
    build:
      context: ..
      dockerfile: docker/Dockerfile.provider-smoke
      args:
        PYTHON_BASE: public.ecr.aws/docker/library/python:3.14.8-slim-trixie@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
    depends_on:
      getcomics:
        condition: service_healthy
      annas-archive:
        condition: service_healthy
      libgen:
        condition: service_healthy
    environment:
      PULLBOX_PROVIDER_TOKEN: ${PULLBOX_PROVIDER_TOKEN:-test-provider-token-with-sufficient-entropy}
      GETCOMICS_URL: http://getcomics:8780
      ANNAS_ARCHIVE_URL: http://annas-archive:8780
      LIBGEN_URL: http://libgen:8780
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    networks:
      - provider-test

networks:
  provider-test:
    internal: true
