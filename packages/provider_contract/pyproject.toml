[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pullbox-direct-provider-contract"
version = "1.0.0"
description = "Pullbox direct-download provider protocol contract"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pullbox_provider_contract"]
